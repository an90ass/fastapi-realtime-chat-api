[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "alembic",
    "venv",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",  # Fatal runtime & syntax errors
    "F",   # Pyflakes (undefined variables, bugs, broken code)
]
ignore = [
    "E501",  # Line length
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/*" = ["ALL"]
"tests/*" = ["F401", "F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
